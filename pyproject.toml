[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vitourabsa"
version = "1.0.0"
description = "ViTourABSA: Vietnamese aspect-based sentiment analysis in tourism (dataset tools and benchmark)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["vitourabsa*"]
